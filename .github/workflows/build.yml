name: Build Android APK and Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
        packages: 'platform-tools'

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-Coupures-Gaz-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    name: Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows
        run: npm run dist:win

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-Coupures-Gaz-Windows-EXE
          path: release/*.exe
